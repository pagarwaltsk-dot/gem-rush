name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the app
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk GemRush.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GemRush-apk
          path: GemRush.apk

      - name: Publish a download for phones
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Gem Rush 1.0.${{ github.run_number }}
          body: Download GemRush.apk on each phone and open it to install.
          files: GemRush.apk
          make_latest: true
